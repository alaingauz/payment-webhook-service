services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhooks"]
      interval: 3s
      timeout: 3s
      retries: 10

  migration:
    build: .
    command: ["node", "dist/database/migration-runner.js"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: webhooks
      MIGRATIONS_DIR: /app/dist/database/migrations
    depends_on:
      postgres:
        condition: service_healthy

  provider:
    build: ./provider-simulator
    ports:
      - "4000:4000"
    volumes:
      - ./provider-simulator/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      MODE: api
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: webhooks
      DB_POOL_MAX: "40"
      WEBHOOK_SECRET: dev-webhook-secret-change-me
      PROVIDER_BASE_URL: http://provider:4000
      PROVIDER_TIMEOUT_MS: "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    depends_on:
      migration:
        condition: service_completed_successfully
      provider:
        condition: service_healthy

  worker:
    build: .
    environment:
      MODE: worker
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: webhooks
      DB_POOL_MAX: "2"
      WORKER_POLL_INTERVAL_MS: "100"
      WORKER_ERROR_DELAY_MS: "500"
      WORKER_MAX_ATTEMPTS: "5"
      WORKER_RETRY_BASE_MS: "500"
      WORKER_RETRY_MAX_MS: "30000"
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  pgdata:
